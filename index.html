        h += "</div></section>";
      }
      elPc.innerHTML = h;
      bindPc();
    }
    function bindPc() {
      elPc.querySelectorAll("[data-pc-change]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-pc-change");
          state.pcOpenCat = state.pcOpenCat === cat ? null : cat;
          renderPc();
        });
      });
      elPc.querySelectorAll("[data-pc-remove]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          delete state.pcSel[btn.getAttribute("data-pc-remove")];
          renderPc();
        });
      });
      elPc.querySelectorAll("[data-pc-pick]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var parts = btn.getAttribute("data-pc-pick").split(":");
          state.pcSel[parts[0]] = Number(parts[1]);
          state.pcOpenCat = null;
          renderPc();
        });
      });
      elPc.querySelectorAll("[data-pc-more]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-pc-more");
          state.pcShown[cat] = (state.pcShown[cat] || CAND_PAGE) + CAND_PAGE;
          renderPc();
        });
      });
      elPc.querySelectorAll('input[name="garantia-extendida"]').forEach(function (r) {
        r.addEventListener("change", function () { state.pcWarranty = r.value; renderPc(); });
      });
      var clr = document.getElementById("pcClear");
      if (clr) clr.addEventListener("click", function () {
        state.pcSel = {}; state.pcWarranty = "no"; state.pcOpenCat = null; renderPc();
      });
      bindCommon(elPc);
    }

    /* ------------------- Arma tu sistema de videovigilancia ---------------- */
    function cctvChosenOf(cat) {
      var id = state.cctvSel[cat];
      return id !== undefined ? BY_ID[id] : undefined;
    }
    function cctvQtyOf(cat) { return Math.max(1, state.cctvQty[cat] || 1); }
    function renderCctv() {
      var chosen = [];
      CCTV_CATS.forEach(function (c) {
        var p = cctvChosenOf(c.key);
        if (p) chosen.push({ cat: c.key, label: c.label, product: p, qty: cctvQtyOf(c.key) });
      });
      var camSel = cctvChosenOf("camara"), recSel = cctvChosenOf("grabador");
      var hddSel = cctvChosenOf("disco_duro"), sdSel = cctvChosenOf("memoria_sd");
      var camQty = chosen.some(function (c) { return c.cat === "camara"; }) ? cctvQtyOf("camara") : 0;
      var warnings = [];
      if (camSel && isWifiCamera(camSel) && !sdSel && !recSel) {
        warnings.push("Tu cámara es WiFi: sin memoria microSD ni grabador no tiene dónde guardar el video. Elige una memoria microSD o un grabador.");
      }
      if (recSel && !hddSel) {
        warnings.push("Elegiste grabador pero todavía no hay disco duro: sin disco, el DVR/XVR/NVR no puede grabar. Agrega un disco duro para videovigilancia.");
      }
      if (camSel && recSel) {
        var rt = recorderType(recSel);
        if (rt === "NVR" && !isIpCamera(camSel) && !isWifiCamera(camSel)) {
          warnings.push("Ojo: elegiste un NVR, que trabaja con cámaras IP. Si tu cámara es analógica (coaxial/BNC), necesitas un DVR o XVR. Confírmalo por WhatsApp antes de pedir.");
        }
        if (rt === "DVR" && isIpCamera(camSel)) {
          warnings.push("Ojo: elegiste un DVR, que trabaja con cámaras analógicas. Si tu cámara es IP, necesitas un NVR o un XVR compatible. Confírmalo por WhatsApp antes de pedir.");
        }
      }
      var recommendedMissing = [];
      if (camSel && !cctvChosenOf("conectores")) recommendedMissing.push("Conectores y baluns");
      if (camSel && !cctvChosenOf("cajas")) recommendedMissing.push("Cajas con tapa");
      if (camSel && !isWifiCamera(camSel) && !cctvChosenOf("cable")) recommendedMissing.push("Cable");
      if (camSel && !cctvChosenOf("fuente_cctv")) recommendedMissing.push("Fuente de poder");
      var partsTotal = chosen.reduce(function (s, c) { return s + c.product.price_cents * c.qty; }, 0);
      var hasCam = camSel !== undefined;
      var hasRecording = recSel !== undefined || sdSel !== undefined;
      var anyCandidates = CCTV_CATS.some(function (c) { return cctvCandidates(c.key).length > 0; });

      var h = "";
      h += '<div class="builder-head"><span class="bh-ico">' + icon(I.video) + '</span><div><h2 class="font-display">Arma tu sistema de videovigilancia</h2>' +
        "<p>Elige cámaras, grabador DVR, XVR o NVR, disco duro, memoria microSD si tu cámara es WiFi, conectores, cajas con tapa, cable y fuente. " +
        "Puedes poner la cantidad que necesitas en cada paso (por ejemplo, 4 cámaras). Si una pieza no tiene disponibilidad en " + esc(SETTINGS.main_branch) +
        " pero sí en otra sucursal, también la puedes elegir: se pide de esa sucursal. Al final pides todo junto por WhatsApp.</p></div></div>";
      h += '<p class="builder-progress">' + chosen.length + " de " + CCTV_CATS.length + " pasos elegidos";
      if (hasCam && hasRecording) h += ' <span class="ok">· Ya tienes cómo grabar</span>';
      else if (chosen.length > 0) {
        h += ' <span class="warn">· Para grabar te falta: ' + (!hasCam ? "Cámaras" : "") + (!hasCam && !hasRecording ? " y " : "") +
          (!hasRecording ? "grabador + disco duro, o memoria microSD (cámara WiFi)" : "") + "</span>";
      }
      if (camQty > 1) h += ' <span class="dim">· ' + camQty + " cámaras</span>";
      h += "</p>";
      if (!anyCandidates) {
        h += '<div class="builder-empty">' + icon(I.video) + '<p class="t font-display">Todavía no hay productos de videovigilancia</p>' +
          '<p class="s">Muy pronto vas a poder armar tu sistema de videovigilancia aquí con los productos de la tienda.</p></div>';
        elCctv.innerHTML = h;
        return;
      }
      h += '<div class="builder-steps">';
      CCTV_CATS.forEach(function (c) {
        var candidates = cctvCandidates(c.key);
        var selId = state.cctvSel[c.key];
        var sel = selId !== undefined ? BY_ID[selId] : undefined;
        var isOpen = state.cctvOpenCat === c.key;
        var shownCount = state.cctvShown[c.key] || CAND_PAGE;
        var isBase = CCTV_BASE_CATS.indexOf(c.key) >= 0;
        h += '<section class="step" aria-label="Paso: ' + esc(c.label) + '"><div class="step-head"><h3 class="font-display">' + esc(c.label) +
          (isBase ? '<span class="base-tag">BASE</span>' : "") + '</h3><span class="step-hint">' + esc(c.hint) + "</span></div>";
        if (sel) {
          h += selRowHtml(sel, "cctv");
          var q = cctvQtyOf(c.key);
          h += '<div class="qty-row"><label for="cctv-qty-' + c.key + '">Cantidad</label>' +
            '<button type="button" class="btn-ghost" data-cctv-minus="' + c.key + '" aria-label="Quitar una pieza de ' + esc(c.label) + '">−</button>' +
            '<input id="cctv-qty-' + c.key + '" type="number" min="1" max="99" value="' + q + '" data-cctv-qty="' + c.key + '" aria-label="Cantidad de ' + esc(c.label) + '">' +
            '<button type="button" class="btn-ghost" data-cctv-plus="' + c.key + '" aria-label="Agregar una pieza de ' + esc(c.label) + '">+</button>' +
            (q > 1 ? '<span class="qty-total">= ' + fmtMXN(sel.price_cents * q) + "</span>" : "") + "</div>";
          h += '<div class="qty-row" style="margin-top:8px"><button type="button" class="btn-ghost" data-cctv-change="' + c.key + '" aria-label="Cambiar ' + esc(c.label) + '" aria-expanded="' + isOpen + '">Cambiar</button>' +
            '<button type="button" class="btn-remove" data-cctv-remove="' + c.key + '" aria-label="Quitar ' + esc(c.label) + ' de mi sistema">Quitar</button></div>';
        } else if (candidates.length > 0) {
          h += '<button type="button" class="btn-primary silver-btn step-pick" data-cctv-change="' + c.key + '" aria-label="Elegir ' + esc(c.label) + '" aria-expanded="' + isOpen + '">' +
            icon(I.plus) + "Elegir " + esc(c.label.toLowerCase()) + "</button>";
        } else {
          h += '<p class="step-empty">Todavía no hay productos de este paso en la tienda.</p>';
        }
        if (isOpen && candidates.length > 0) {
          var page = candidates.slice(0, shownCount);
          h += '<ul class="cand-list">';
          page.forEach(function (p) {
            var isSel = selId === p.id;
            var out = !builderHasStock(p);
            var otherOnly = builderOtherBranchOnly(p);
            var aria = out ? p.name + " está agotado en todas las sucursales"
              : otherOnly ? p.name + ": sin piezas en " + SETTINGS.main_branch + ", disponible en otra sucursal. Elegir como " + c.label
              : "Elegir " + p.name + " como " + c.label;
            h += '<li><button type="button" class="cand' + (isSel ? " is-sel" : "") + '" data-cctv-pick="' + c.key + ":" + p.id + '"' +
              (out ? " disabled" : "") + ' aria-label="' + esc(aria) + '">' +
              thumbHtml(p, "cand-thumb") + '<span class="cand-info"><span class="cand-name">' + esc(p.name) + '</span>' +
              '<span class="cand-meta"><span class="cand-price price-num silver-text">' + fmtMXN(p.price_cents) + "</span>" +
              (otherOnly ? '<span class="chip-outline">OTRA SUCURSAL</span>' : stockBadge(p.stock_status)) +
              (c.key === "camara" && isWifiCamera(p) ? '<span class="chip">WIFI</span>' : "") +
              (c.key === "camara" && isIpCamera(p) ? '<span class="chip">IP</span>' : "") +
              (c.key === "grabador" && recorderType(p) ? '<span class="chip">' + recorderType(p) + "</span>" : "") +
              (p.cctv_cat === null ? '<span class="suggested-note">SUGERIDO POR EL NOMBRE</span>' : "") + "</span>" +
              (otherOnly ? '<span class="cand-warn">Sin piezas en ' + esc(SETTINGS.main_branch) + " — se pide de otra sucursal" +
                (otherBranchSummary(p) ? " (" + esc(otherBranchSummary(p)) + ")" : "") + "</span>" : "") +
              "</span>" + (isSel ? icon(I.check, "check") : "") + "</button></li>";
          });
          h += "</ul>";
          if (candidates.length > shownCount) {
            h += '<div class="cand-more"><p>Mostrando ' + page.length + " de " + candidates.length + " opciones en " + esc(c.label) + "</p>" +
              '<button type="button" class="btn-ghost" data-cctv-more="' + c.key + '" aria-label="Mostrar más opciones de ' + esc(c.label) + '">Mostrar más (' + (candidates.length - shownCount) + " más)</button></div>";
          }
        }
        h += "</section>";
      });
      h += "</div>";
      if (chosen.length > 0) {
        h += '<section class="summary" aria-label="Resumen de tu sistema de videovigilancia"><h3 class="font-display">Tu sistema de videovigilancia</h3><ul>' +
          chosen.map(function (c) {
            return "<li><span class=\"sl\"><strong>" + esc(c.label) + ":</strong> <span class=\"nm\">" + (c.qty > 1 ? c.qty + " × " : "") + esc(c.product.name) + "</span>" +
              (builderOtherBranchOnly(c.product) ? '<span class="other-note">Sin piezas en ' + esc(SETTINGS.main_branch) + ": se pide de otra sucursal</span>" : "") +
              '</span><span class="sp price-num">' + fmtMXN(c.product.price_cents * c.qty) + "</span></li>";
          }).join("") + "</ul>";
        h += '<div class="sum-block"><div class="sum-total" style="border-top:none;margin-top:0;padding-top:0"><span class="k">TOTAL</span><span class="v price-num silver-text">' + fmtMXN(partsTotal) + "</span></div>" +
          '<p class="sum-card-note">' + (SETTINGS.iva_included ? "IVA incluido" : "Más IVA") + " · Con tarjeta: " + fmtMXN(cardPriceCents(partsTotal)) +
          (SETTINGS.card_surcharge_pct > 0 ? " (+" + SETTINGS.card_surcharge_pct + "%)" : "") + "</p>";
        warnings.forEach(function (w) { h += '<p class="sum-warn">' + esc(w) + "</p>"; });
        if (recommendedMissing.length && hasCam) {
          h += '<p class="sum-dim">Recomendados que aún no eliges: ' + esc(recommendedMissing.join(", ")) + ". Sin ellos el sistema puede quedar incompleto para instalar.</p>";
        }
        if (chosen.some(function (c) { return builderOtherBranchOnly(c.product); })) {
          h += '<p class="sum-warn">Ojo: hay piezas que no tienen disponibilidad en ' + esc(SETTINGS.main_branch) + "; se piden de otra sucursal y pueden tardar un poco más.</p>";
        }
        h += '<div class="sum-actions">';
        if (WA_DIGITS) {
          var lines = ["Hola, quiero pedir este sistema de videovigilancia de " + SETTINGS.store_name + ":"];
          chosen.forEach(function (c) {
            lines.push("• " + c.label + ": " + (c.qty > 1 ? c.qty + " × " : "") + c.product.name + " — " + fmtMXN(c.product.price_cents * c.qty) +
              (builderOtherBranchOnly(c.product) ? " (en " + SETTINGS.main_branch + " no hay: se pide de otra sucursal)" : ""));
          });
          lines.push("TOTAL: " + fmtMXN(partsTotal) + (SETTINGS.iva_included ? " (IVA incluido)" : " + IVA"));
          warnings.forEach(function (w) { lines.push("OJO: " + w); });
          if (!hasCam) lines.push("Todavía me falta elegir las cámaras.");
          else if (!hasRecording) lines.push("Todavía me falta elegir cómo grabar (grabador + disco duro, o memoria microSD para cámara WiFi).");
          if (recommendedMissing.length) lines.push("Sin elegir todavía (recomendados): " + recommendedMissing.join(", ") + ".");
          h += '<a class="btn-primary silver-btn" style="padding:12px 20px;font-size:16px" target="_blank" rel="noreferrer" href="https://wa.me/' + WA_DIGITS + "?text=" +
            encodeURIComponent(lines.join("\n")) + '" aria-label="Pedir este sistema de videovigilancia completo por WhatsApp">' + icon(I.phone) + "Pedir este sistema por WhatsApp</a>";
        } else {
          h += '<p class="btn-agotado-big" style="width:auto;padding:12px 20px">Pedidos por WhatsApp muy pronto</p>';
        }
        h += '<button type="button" class="btn-ghost" id="cctvClear" aria-label="Vaciar mi sistema de videovigilancia y empezar de nuevo">' + icon(I.trash) + "Vaciar</button></div>";
        h += "</div></section>";
      }
      elCctv.innerHTML = h;
      bindCctv();
    }
    function bindCctv() {
      elCctv.querySelectorAll("[data-cctv-change]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-cctv-change");
          state.cctvOpenCat = state.cctvOpenCat === cat ? null : cat;
          renderCctv();
        });
      });
      elCctv.querySelectorAll("[data-cctv-remove]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-cctv-remove");
          delete state.cctvSel[cat];
          delete state.cctvQty[cat];
          renderCctv();
        });
      });
      elCctv.querySelectorAll("[data-cctv-pick]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var parts = btn.getAttribute("data-cctv-pick").split(":");
          state.cctvSel[parts[0]] = Number(parts[1]);
          if (!state.cctvQty[parts[0]]) state.cctvQty[parts[0]] = 1;
          state.cctvOpenCat = null;
          renderCctv();
        });
      });
      elCctv.querySelectorAll("[data-cctv-more]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-cctv-more");
          state.cctvShown[cat] = (state.cctvShown[cat] || CAND_PAGE) + CAND_PAGE;
          renderCctv();
        });
      });
      elCctv.querySelectorAll("[data-cctv-minus]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-cctv-minus");
          state.cctvQty[cat] = Math.max(1, cctvQtyOf(cat) - 1);
          renderCctv();
        });
      });
      elCctv.querySelectorAll("[data-cctv-plus]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-cctv-plus");
          state.cctvQty[cat] = Math.min(99, cctvQtyOf(cat) + 1);
          renderCctv();
        });
      });
      elCctv.querySelectorAll("[data-cctv-qty]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var cat = inp.getAttribute("data-cctv-qty");
          var v = parseInt(inp.value, 10);
          state.cctvQty[cat] = isNaN(v) ? 1 : Math.max(1, Math.min(99, v));
          renderCctv();
        });
      });
      var clr = document.getElementById("cctvClear");
      if (clr) clr.addEventListener("click", function () {
        state.cctvSel = {}; state.cctvQty = {}; state.cctvOpenCat = null; renderCctv();
      });
      bindCommon(elCctv);
    }

    /* ------------------------------- Inicio ------------------------------- */
    document.getElementById("navTienda").addEventListener("click", function () { go("tienda"); });
    document.getElementById("navPc").addEventListener("click", function () { go("pc"); });
    document.getElementById("navCctv").addEventListener("click", function () { go("cctv"); });
    var loading = document.getElementById("loadingNote");
    if (loading) loading.remove();
    renderTienda();
    showView();
    </script>
  </body>
</html>
